name: Syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python source
        run: python3 -m py_compile phone-input-guard.py

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source
        shell: powershell
        run: |
          foreach ($path in @(
              'phone-input-guard-windows.ps1',
              'windows-ble-scan.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Compile Windows BLE bridge
        shell: powershell
        run: |
          .\windows-ble-scan.ps1 `
            -ServiceUuid '00000000-0000-4000-8000-000000000000' `
            -CompileOnly
