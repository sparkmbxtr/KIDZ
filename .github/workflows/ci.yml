name: Syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python source
        run: python3 -m py_compile phone-input-guard.py

  windows-native-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify native input helper
        run: |
          as --64 -o /tmp/windows-input-hook-helper.o windows-input-hook-helper.S
          ld -mi386pep --subsystem windows --entry start --strip-all \
            --image-base 0x140000000 --file-alignment 512 --section-alignment 4096 \
            --disable-dynamicbase --disable-high-entropy-va --disable-reloc-section \
            --no-insert-timestamp \
            -o /tmp/windows-input-hook-helper.exe /tmp/windows-input-hook-helper.o
          cmp windows-input-hook-helper.exe /tmp/windows-input-hook-helper.exe
          printf '%s  %s\n' \
            '0adc71ca80b19003db434b2bff0bf3dc63bb686d180095e67f6478c77d8c2d66' \
            'windows-input-hook-helper.exe' | sha256sum --check
          objdump -p windows-input-hook-helper.exe | grep -F 'SetWindowsHookExW'
          objdump -p windows-input-hook-helper.exe | grep -F 'UnhookWindowsHookEx'

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source
        shell: powershell
        run: |
          foreach ($path in @(
              'phone-input-guard-windows.ps1',
              'phone-input-guard-windows-ble.ps1',
              'windows-ble-scan.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Compile Windows BLE bridge
        shell: powershell
        run: |
          .\windows-ble-scan.ps1 `
            -ServiceUuid '00000000-0000-4000-8000-000000000000' `
            -CompileOnly
          .\phone-input-guard-windows-ble.ps1 CompileOnly
          # Run again in the same Windows PowerShell process. This verifies
          # that the source-hashed bridge identities safely reuse loaded DLLs.
          .\phone-input-guard-windows-ble.ps1 CompileOnly
      - name: Exercise per-user startup registration
        shell: powershell
        run: |
          $source = (Resolve-Path '.\phone-input-guard-windows-ble.ps1').Path
          & $source Install `
            -ServiceUuid '11111111-1111-4111-8111-111111111111' `
            -LockRssi -84 `
            -UnlockRssi -80 `
            -AbsenceSeconds 11 `
            -ExcludedWifiNames @('XX1','XX2','XX3') `
            -BannerText 'XX'

          $installed = Join-Path $env:LOCALAPPDATA `
            'KIDZ\phone-input-guard-windows-ble.ps1'
          $launcher = Join-Path $env:LOCALAPPDATA `
            'KIDZ\phone-input-guard-startup-2.2.2.exe'
          $legacyLauncher = Join-Path $env:LOCALAPPDATA `
            'KIDZ\phone-input-guard-startup.vbs'
          'legacy test shim' | Set-Content -LiteralPath $legacyLauncher
          & $installed RepairStartup

          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw 'RepairStartup did not create the native startup launcher.'
          }
          if (Test-Path -LiteralPath $legacyLauncher) {
            throw 'RepairStartup left the legacy WScript launcher in place.'
          }
          $launcherVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo(
            $launcher).FileVersion
          if ([string]$launcherVersion -ne '2.2.2.0') {
            throw "Unexpected native startup launcher version: $launcherVersion"
          }

          # Verify IMAGE_OPTIONAL_HEADER.Subsystem ==
          # IMAGE_SUBSYSTEM_WINDOWS_GUI (2), so the launcher has no console.
          $stream = [IO.File]::OpenRead($launcher)
          try {
            $reader = New-Object IO.BinaryReader($stream)
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) {
              throw 'The native startup launcher has no valid PE signature.'
            }
            $stream.Position = $peOffset + 24 + 68
            if ($reader.ReadUInt16() -ne 2) {
              throw 'The native startup launcher is not a GUI-subsystem executable.'
            }
          }
          finally {
            if ($null -ne $reader) { $reader.Dispose() }
            else { $stream.Dispose() }
          }

          $firstLauncherHash = (Get-FileHash -LiteralPath $launcher `
            -Algorithm SHA256).Hash
          & $installed RepairStartup
          $secondLauncherHash = (Get-FileHash -LiteralPath $launcher `
            -Algorithm SHA256).Hash
          if ($firstLauncherHash -ne $secondLauncherHash) {
            throw 'RepairStartup needlessly recompiled the valid launcher.'
          }

          $service = New-Object -ComObject 'Schedule.Service'
          $service.Connect()
          $root = $service.GetFolder('\')
          $task = $root.GetTask('\KIDZ Phone Input Guard Logon')
          if (-not $task.Enabled) {
            throw 'The startup task was registered but is disabled.'
          }
          $action = $task.Definition.Actions.Item(1)
          if ((-not [string]::Equals(
                  [string]$action.Path,
                  $launcher,
                  [StringComparison]::OrdinalIgnoreCase)) -or
              (-not [string]::Equals(
                  [string]$action.Arguments,
                  'task',
                  [StringComparison]::Ordinal)) -or
              (-not [string]::Equals(
                  [string]$action.WorkingDirectory,
                  (Split-Path -Parent $installed),
                  [StringComparison]::Ordinal))) {
            throw 'The startup task action is not the expected native GUI command.'
          }
          if ($task.Definition.Settings.DisallowStartIfOnBatteries -or $task.Definition.Settings.StopIfGoingOnBatteries) {
            throw 'The startup task incorrectly stops or refuses to start on battery power.'
          }

          $runValue = (Get-ItemProperty `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
            -Name 'KIDZ Phone Input Guard').'KIDZ Phone Input Guard'
          $expectedRunValue = '"{0}" fallback' -f $launcher
          if (-not [string]::Equals(
                  [string]$runValue,
                  $expectedRunValue,
                  [StringComparison]::Ordinal)) {
            throw 'The HKCU Run fallback is not the expected native GUI command.'
          }
          if (([string]$action.Path -match '(?i)wscript|powershell') -or
              ([string]$runValue -match '(?i)wscript|powershell|\.vbs')) {
            throw 'A startup entry still invokes a script host or PowerShell directly.'
          }

          $invalid = Start-Process -FilePath $launcher -ArgumentList 'invalid' `
            -Wait -PassThru
          if ($invalid.ExitCode -ne 64) {
            throw ('The native launcher accepted an invalid mode; exit code=' +
              [string]$invalid.ExitCode)
          }

          # Execute the generated launcher while disarmed. This verifies the
          # child-process command without ever allowing input blocking.
          $startupState = Join-Path $env:LOCALAPPDATA `
            'KIDZ\windows-ble-startup.json'
          Remove-Item -LiteralPath $startupState -Force -ErrorAction SilentlyContinue
          $probe = Start-Process -FilePath $launcher -ArgumentList 'task' `
            -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            throw ('The native startup launcher failed; exit code=' +
              [string]$probe.ExitCode)
          }
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while ((-not (Test-Path -LiteralPath $startupState)) -and
              ([DateTime]::UtcNow -lt $deadline)) {
            Start-Sleep -Milliseconds 200
          }
          if (-not (Test-Path -LiteralPath $startupState)) {
            throw 'The native startup launcher did not invoke the supervisor.'
          }
          $launcherState = Get-Content -LiteralPath $startupState -Raw |
            ConvertFrom-Json
          if ([string]$launcherState.status -ne 'Disarmed') {
            throw ('The native startup probe returned unexpected status: ' +
              [string]$launcherState.status)
          }

          & $installed Check
          & $installed Uninstall

          try {
            $null = $root.GetTask('\KIDZ Phone Input Guard Logon')
            throw 'Uninstall left the startup task registered.'
          }
          catch {
            if (([long]$_.Exception.HResult -band 65535) -ne 2) {
              throw
            }
          }
          $remainingRunValue = Get-ItemProperty `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
            -Name 'KIDZ Phone Input Guard' `
            -ErrorAction SilentlyContinue
          if ($null -ne $remainingRunValue) {
            throw 'Uninstall left the HKCU Run fallback registered.'
          }

          # Get-ActiveWifiNames uses netsh as one of its read-only probes.
          # A runner without a WLAN interface can leave LASTEXITCODE=1 even
          # though Check, task registration, and every assertion succeeded.
          $global:LASTEXITCODE = 0
