name: Syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python source
        run: python3 -m py_compile phone-input-guard.py

  windows-native-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify native input helper
        run: |
          as --64 -o /tmp/windows-input-hook-helper.o windows-input-hook-helper.S
          ld -mi386pep --subsystem windows --entry start --strip-all \
            --image-base 0x140000000 --file-alignment 512 --section-alignment 4096 \
            --disable-dynamicbase --disable-high-entropy-va --disable-reloc-section \
            --no-insert-timestamp \
            -o /tmp/windows-input-hook-helper.exe /tmp/windows-input-hook-helper.o
          cmp windows-input-hook-helper.exe /tmp/windows-input-hook-helper.exe
          printf '%s  %s\n' \
            '0adc71ca80b19003db434b2bff0bf3dc63bb686d180095e67f6478c77d8c2d66' \
            'windows-input-hook-helper.exe' | sha256sum --check
          objdump -p windows-input-hook-helper.exe | grep -F 'SetWindowsHookExW'
          objdump -p windows-input-hook-helper.exe | grep -F 'UnhookWindowsHookEx'

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source
        shell: powershell
        run: |
          foreach ($path in @(
              'phone-input-guard-windows.ps1',
              'phone-input-guard-windows-ble.ps1',
              'windows-ble-scan.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Compile Windows BLE bridge
        shell: powershell
        run: |
          .\windows-ble-scan.ps1 `
            -ServiceUuid '00000000-0000-4000-8000-000000000000' `
            -CompileOnly
          .\phone-input-guard-windows-ble.ps1 CompileOnly
          # Run again in the same Windows PowerShell process. This verifies
          # that the source-hashed bridge identities safely reuse loaded DLLs.
          .\phone-input-guard-windows-ble.ps1 CompileOnly
      - name: Exercise per-user startup registration
        shell: powershell
        run: |
          $source = (Resolve-Path '.\phone-input-guard-windows-ble.ps1').Path
          & $source Install `
            -ServiceUuid '11111111-1111-4111-8111-111111111111' `
            -LockRssi -84 `
            -UnlockRssi -80 `
            -AbsenceSeconds 11 `
            -ExcludedWifiNames @('XX1','XX2','XX3') `
            -BannerText 'XX'

          $installed = Join-Path $env:LOCALAPPDATA `
            'KIDZ\phone-input-guard-windows-ble.ps1'
          $launcher = Join-Path $env:LOCALAPPDATA `
            'KIDZ\phone-input-guard-startup-2.3.0.exe'
          $legacyLauncher = Join-Path $env:LOCALAPPDATA `
            'KIDZ\phone-input-guard-startup.vbs'
          'legacy test shim' | Set-Content -LiteralPath $legacyLauncher

          # Simulate the deployed 2.2 layout: an old native action with only
          # a logon trigger. RepairStartup must replace it during migration.
          $migrationService = New-Object -ComObject 'Schedule.Service'
          $migrationService.Connect()
          $migrationRoot = $migrationService.GetFolder('\')
          $migrationDefinition = $migrationService.NewTask(0)
          $migrationUser = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $migrationDefinition.Principal.UserId = $migrationUser
          $migrationDefinition.Principal.LogonType = 3
          $migrationDefinition.Principal.RunLevel = 0
          $migrationDefinition.Settings.Enabled = $true
          $migrationDefinition.Settings.DisallowStartIfOnBatteries = $false
          $migrationDefinition.Settings.StopIfGoingOnBatteries = $false
          $oldTrigger = $migrationDefinition.Triggers.Create(9)
          $oldTrigger.Enabled = $true
          $oldTrigger.UserId = $migrationUser
          $oldTrigger.Delay = 'PT5S'
          $oldAction = $migrationDefinition.Actions.Create(0)
          $oldAction.Path = Join-Path $env:LOCALAPPDATA `
            'KIDZ\phone-input-guard-startup-2.2.0.exe'
          $oldAction.Arguments = 'task'
          $oldAction.WorkingDirectory = Split-Path -Parent $installed
          $null = $migrationRoot.RegisterTaskDefinition(
            'KIDZ Phone Input Guard Logon',
            $migrationDefinition,
            6,
            $migrationUser,
            $null,
            3,
            $null)

          & $installed RepairStartup

          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw 'RepairStartup did not create the native startup launcher.'
          }
          if (Test-Path -LiteralPath $legacyLauncher) {
            throw 'RepairStartup left the legacy WScript launcher in place.'
          }
          $launcherVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo(
            $launcher).FileVersion
          if ([string]$launcherVersion -ne '2.3.0.0') {
            throw "Unexpected native startup launcher version: $launcherVersion"
          }

          # Verify IMAGE_OPTIONAL_HEADER.Subsystem ==
          # IMAGE_SUBSYSTEM_WINDOWS_GUI (2), so the launcher has no console.
          $stream = [IO.File]::OpenRead($launcher)
          try {
            $reader = New-Object IO.BinaryReader($stream)
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) {
              throw 'The native startup launcher has no valid PE signature.'
            }
            $stream.Position = $peOffset + 24 + 68
            if ($reader.ReadUInt16() -ne 2) {
              throw 'The native startup launcher is not a GUI-subsystem executable.'
            }
          }
          finally {
            if ($null -ne $reader) { $reader.Dispose() }
            else { $stream.Dispose() }
          }

          $firstLauncherHash = (Get-FileHash -LiteralPath $launcher `
            -Algorithm SHA256).Hash
          & $installed RepairStartup
          $secondLauncherHash = (Get-FileHash -LiteralPath $launcher `
            -Algorithm SHA256).Hash
          if ($firstLauncherHash -ne $secondLauncherHash) {
            throw 'RepairStartup needlessly recompiled the valid launcher.'
          }

          $service = New-Object -ComObject 'Schedule.Service'
          $service.Connect()
          $root = $service.GetFolder('\')
          $task = $root.GetTask('\KIDZ Phone Input Guard Logon')
          if (-not $task.Enabled) {
            throw 'The startup task was registered but is disabled.'
          }
          $action = $task.Definition.Actions.Item(1)
          if ((-not [string]::Equals(
                  [string]$action.Path,
                  $launcher,
                  [StringComparison]::OrdinalIgnoreCase)) -or
              (-not [string]::Equals(
                  [string]$action.Arguments,
                  'task',
                  [StringComparison]::Ordinal)) -or
              (-not [string]::Equals(
                  [string]$action.WorkingDirectory,
                  (Split-Path -Parent $installed),
                  [StringComparison]::Ordinal))) {
            throw 'The startup task action is not the expected native GUI command.'
          }
          $triggers = @(
            for ($i = 1; $i -le $task.Definition.Triggers.Count; $i++) {
              $task.Definition.Triggers.Item($i)
            }
          )
          $logonTriggers = @($triggers | Where-Object { [int]$_.Type -eq 9 })
          $unlockTriggers = @($triggers | Where-Object {
              ([int]$_.Type -eq 11) -and ([int]$_.StateChange -eq 8)
            })
          $resumeTriggers = @($triggers | Where-Object {
              ([int]$_.Type -eq 0) -and
              ([string]$_.Subscription -match
                'Microsoft-Windows-Kernel-Power') -and
              ([string]$_.Subscription -match 'EventID\s*=\s*107') -and
              ([string]$_.Subscription -match 'EventID\s*=\s*507')
            })
          if (($triggers.Count -ne 3) -or
              ($logonTriggers.Count -ne 1) -or
              ($unlockTriggers.Count -ne 1) -or
              ($resumeTriggers.Count -ne 1)) {
            throw ('The startup task lacks the exact logon + session-unlock + resume ' +
              'recovery triggers.')
          }
          $currentUserId = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          foreach ($trigger in @($logonTriggers[0], $unlockTriggers[0])) {
            if ((-not [bool]$trigger.Enabled) -or
                (-not [string]::Equals(
                    [string]$trigger.UserId,
                    $currentUserId,
                    [StringComparison]::OrdinalIgnoreCase))) {
              throw 'A startup recovery trigger is disabled or belongs to another user.'
            }
          }
          if (([string]$logonTriggers[0].Delay -ne 'PT5S') -or
              ([string]$unlockTriggers[0].Delay -ne 'PT2S') -or
              ([string]$resumeTriggers[0].Delay -ne 'PT2S') -or
              (-not [bool]$resumeTriggers[0].Enabled)) {
            throw 'The startup recovery trigger delays are not the expected values.'
          }
          if ([int]$task.Definition.Settings.MultipleInstances -ne 2) {
            throw 'The startup task does not ignore duplicate supervisor launches.'
          }
          if (-not $task.Definition.Settings.StartWhenAvailable) {
            throw 'The startup task does not retain its requested availability setting.'
          }
          if ($task.Definition.Settings.DisallowStartIfOnBatteries -or $task.Definition.Settings.StopIfGoingOnBatteries) {
            throw 'The startup task incorrectly stops or refuses to start on battery power.'
          }

          # Regression for a real lid-close failure: zero active Wi-Fi names
          # must be a valid input, not a terminating parameter-binding error.
          . $installed CompileOnly
          $runtimeTaskInfo = Get-StartupTaskInfo
          if ((-not [bool]$runtimeTaskInfo.Registered) -or
              (-not [bool]$runtimeTaskInfo.ActionMatches) -or
              (-not [bool]$runtimeTaskInfo.TriggersMatch)) {
            throw ('The script rejected its own repaired startup task: ' +
              [string]$runtimeTaskInfo.Error)
          }
          $emptyWifiConfig = [pscustomobject]@{
            excluded_wifi_names = @('XX1','XX2','XX3')
          }
          $emptyWifiMatch = Get-ExcludedWifiMatch `
            -Config $emptyWifiConfig -ActiveNames @()
          if ($null -ne $emptyWifiMatch) {
            throw 'An empty active Wi-Fi list unexpectedly matched an exclusion.'
          }

          # A stale PID must never claim an unrelated process, while the
          # version-2.2 ready-file identity remains recognized for migration.
          $probePowerShell = Join-Path $env:SystemRoot `
            'System32\WindowsPowerShell\v1.0\powershell.exe'
          $identityProbe = Start-Process -FilePath $probePowerShell `
            -ArgumentList '-NoProfile','-NonInteractive','-Command',
              'Start-Sleep -Seconds 30' `
            -WindowStyle Hidden -PassThru
          try {
            $identityProbe.Id | Set-Content -LiteralPath $Script:PidPath `
              -Encoding ASCII
            Remove-Item -LiteralPath $Script:IdentityPath,$Script:ReadyPath `
              -Force -ErrorAction SilentlyContinue
            if (Test-GuardProcess) {
              throw 'A stale PID incorrectly claimed an unrelated process.'
            }
            $legacyReady = [pscustomobject]@{
              pid = $identityProbe.Id
              process_start_utc_ticks = `
                $identityProbe.StartTime.ToUniversalTime().Ticks
              ready_utc = [DateTime]::UtcNow.ToString('o')
              version = '2.2.0'
            }
            $legacyReady | ConvertTo-Json | Set-Content `
              -LiteralPath $Script:ReadyPath -Encoding UTF8
            if (-not (Test-GuardProcess)) {
              throw 'The safe version-2.2 process identity fallback was not recognized.'
            }
            $identityProbe.Refresh()
            if ($identityProbe.HasExited) {
              throw 'Ownership checks terminated the unrelated probe process.'
            }

            # A future heartbeat (for example after a wall-clock rollback)
            # must not authorize an immediate kill. The same exact process
            # and unchanged metadata may be recovered after a monotonic 20s
            # observation supplied by the supervisor.
            $legacyReady | Add-Member -NotePropertyName heartbeat_utc `
              -NotePropertyValue ([DateTime]::UtcNow.AddHours(1).ToString('o'))
            $legacyReady | ConvertTo-Json | Set-Content `
              -LiteralPath $Script:ReadyPath -Encoding UTF8
            $futureSnapshot = Get-GuardLivenessSnapshot
            if ($null -eq $futureSnapshot) {
              throw 'The future-heartbeat liveness snapshot was not captured.'
            }
            if (Stop-StaleGuardProcess -MinimumHeartbeatAgeSeconds 20 `
                -ExpectedSnapshot $futureSnapshot `
                -ObservedUnchangedMilliseconds 0) {
              throw 'A future heartbeat authorized an immediate process kill.'
            }
            $identityProbe.Refresh()
            if ($identityProbe.HasExited) {
              throw 'The future-heartbeat safety check terminated the probe.'
            }
            if (-not (Stop-StaleGuardProcess -MinimumHeartbeatAgeSeconds 20 `
                  -ExpectedSnapshot $futureSnapshot `
                  -ObservedUnchangedMilliseconds 20000)) {
              throw 'Monotonic unchanged-metadata recovery did not stop the probe.'
            }
            $identityProbe.Refresh()
            if (-not $identityProbe.HasExited) {
              throw 'Stale-process recovery returned success before confirmed exit.'
            }
          }
          finally {
            if (-not $identityProbe.HasExited) {
              $identityProbe.Kill()
              $null = $identityProbe.WaitForExit(5000)
            }
            $identityProbe.Dispose()
            Remove-Item -LiteralPath $Script:PidPath,$Script:IdentityPath,
              $Script:ReadyPath -Force -ErrorAction SilentlyContinue
          }

          $mutationProbe = Start-Process -FilePath $probePowerShell `
            -ArgumentList '-NoProfile','-NonInteractive','-Command',
              'Start-Sleep -Seconds 30' `
            -WindowStyle Hidden -PassThru
          try {
            $mutationProbe.Id | Set-Content -LiteralPath $Script:PidPath `
              -Encoding ASCII
            $mutationReady = [pscustomobject]@{
              pid = $mutationProbe.Id
              process_start_utc_ticks = `
                $mutationProbe.StartTime.ToUniversalTime().Ticks
              heartbeat_utc = [DateTime]::UtcNow.AddHours(1).ToString('o')
              version = '2.2.0'
              marker = 1
            }
            $mutationReady | ConvertTo-Json | Set-Content `
              -LiteralPath $Script:ReadyPath -Encoding UTF8
            $beforeMutation = Get-GuardLivenessSnapshot
            $mutationReady.marker = 2
            $mutationReady | ConvertTo-Json | Set-Content `
              -LiteralPath $Script:ReadyPath -Encoding UTF8
            if (Stop-StaleGuardProcess -MinimumHeartbeatAgeSeconds 20 `
                -ExpectedSnapshot $beforeMutation `
                -ObservedUnchangedMilliseconds 20000) {
              throw 'Changed liveness metadata incorrectly authorized termination.'
            }
            $mutationProbe.Refresh()
            if ($mutationProbe.HasExited) {
              throw 'The metadata-mutation guard terminated the probe process.'
            }
          }
          finally {
            if (-not $mutationProbe.HasExited) {
              $mutationProbe.Kill()
              $null = $mutationProbe.WaitForExit(5000)
            }
            $mutationProbe.Dispose()
            Remove-Item -LiteralPath $Script:PidPath,$Script:IdentityPath,
              $Script:ReadyPath -Force -ErrorAction SilentlyContinue
          }
          if ($null -eq $Script:BleWatcherBridgeType.GetMethod('Restart')) {
            throw 'The BLE bridge lacks its suspend/resume restart method.'
          }
          if ($null -eq $Script:NativeMethodsType.GetMethod('GetMonotonicMilliseconds')) {
            throw 'The native bridge lacks its suspend-aware monotonic clock.'
          }

          $runValue = (Get-ItemProperty `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
            -Name 'KIDZ Phone Input Guard').'KIDZ Phone Input Guard'
          $expectedRunValue = '"{0}" fallback' -f $launcher
          if (-not [string]::Equals(
                  [string]$runValue,
                  $expectedRunValue,
                  [StringComparison]::Ordinal)) {
            throw 'The HKCU Run fallback is not the expected native GUI command.'
          }
          if (([string]$action.Path -match '(?i)wscript|powershell') -or
              ([string]$runValue -match '(?i)wscript|powershell|\.vbs')) {
            throw 'A startup entry still invokes a script host or PowerShell directly.'
          }

          $invalid = Start-Process -FilePath $launcher -ArgumentList 'invalid' `
            -Wait -PassThru
          if ($invalid.ExitCode -ne 64) {
            throw ('The native launcher accepted an invalid mode; exit code=' +
              [string]$invalid.ExitCode)
          }

          # Demand-start the registered task through the same path Arm uses,
          # while disarmed so input blocking is impossible.
          $startupState = Join-Path $env:LOCALAPPDATA `
            'KIDZ\windows-ble-startup.json'
          Remove-Item -LiteralPath $startupState -Force -ErrorAction SilentlyContinue
          $null = Start-StartupSupervisorProcess
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while ((-not (Test-Path -LiteralPath $startupState)) -and
              ([DateTime]::UtcNow -lt $deadline)) {
            Start-Sleep -Milliseconds 200
          }
          if (-not (Test-Path -LiteralPath $startupState)) {
            throw 'The native startup launcher did not invoke the supervisor.'
          }
          $launcherState = Get-Content -LiteralPath $startupState -Raw |
            ConvertFrom-Json
          if ([string]$launcherState.status -ne 'Disarmed') {
            throw ('The native startup probe returned unexpected status: ' +
              [string]$launcherState.status)
          }

          & $installed Check
          & $installed Uninstall

          try {
            $null = $root.GetTask('\KIDZ Phone Input Guard Logon')
            throw 'Uninstall left the startup task registered.'
          }
          catch {
            if (([long]$_.Exception.HResult -band 65535) -ne 2) {
              throw
            }
          }
          $remainingRunValue = Get-ItemProperty `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
            -Name 'KIDZ Phone Input Guard' `
            -ErrorAction SilentlyContinue
          if ($null -ne $remainingRunValue) {
            throw 'Uninstall left the HKCU Run fallback registered.'
          }

          # Get-ActiveWifiNames uses netsh as one of its read-only probes.
          # A runner without a WLAN interface can leave LASTEXITCODE=1 even
          # though Check, task registration, and every assertion succeeded.
          $global:LASTEXITCODE = 0
